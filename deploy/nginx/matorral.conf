# Plain-HTTP reverse proxy in front of Gunicorn. No TLS — this deployment
# doesn't terminate SSL. Replace DOMAIN_PLACEHOLDER with the real
# domain/IP (matching the DOMAIN value in /opt/matorral/.env) before use:
#   sed -i "s/DOMAIN_PLACEHOLDER/$DOMAIN/" /etc/nginx/sites-available/matorral

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    client_max_body_size 20M;

    # User-uploaded media (Django only serves this itself when DEBUG=True).
    location /media/ {
        alias /opt/matorral/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
