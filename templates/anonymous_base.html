{% extends "base.html" %}
{% load i18n %}
{% load static %}
{% block top_nav %}{% endblock %}
{% block body %}

<!-- Hero Image Section -->
<div class="relative w-full h-100 mb-0">
  <img 
    src="{% static 'images/breadcrumb-bg.jpg' %}" 
    alt="Siresoft Banner"
    class="w-full h-full object-cover"
  />
  <!-- Overlay -->
  <div class="absolute inset-0 bg-[#0525A8]/10 flex flex-col items-center justify-center">
    <h1 class="text-white text-4xl font-bold tracking-wide">
      SireSoft Project Management Tool
    </h1>
    <p class="text-white/80 text-md mt-2">
      Home / {% block page_title %}{% endblock %}
    </p>
  </div>
</div>

<!-- Content -->
<div class="flex flex-col items-center my-8">
  {% block content %}{% endblock %}
</div>

{% endblock %}
