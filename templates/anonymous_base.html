{% extends "base.html" %}
{% load i18n %}
{% load static %}
{% block top_nav %}{% endblock %}
{% block body %}

<!-- Hero Image Section -->
<div class="relative w-full h-100 mb-0">
  <img 
    src="{% static 'images/breadcrumb-bg.jpg' %}" 
    alt="Siresoft Banner"
    class="w-full h-full object-cover"
  />
  <!-- Overlay -->
  <div class="absolute inset-0 bg-[#0525A8]/10 flex flex-col items-center justify-center">
    <div class="flex items-center gap-1.5 mb-8">
      <img
        src="{% static 'images/header-icon2.png' %}"
        alt=""
        class="h-12 w-auto object-contain shrink-0"
      />
      <span class="flex flex-col leading-none">
        <img
          src="{% static 'images/header-wordmark2.png' %}"
          alt="Siresoft"
          class="h-8 w-auto object-contain"
        />
        <span class="text-xs font-bold text-white tracking-wide mt-1 block w-full text-center">
          {% translate "Leader in Innovation" %}
        </span>
      </span>
    </div>
    <h1 class="text-white text-4xl font-bold tracking-wide">
      {% block page_heading %}SireSoft Project Management Tool{% endblock %}
    </h1>
  </div>
</div>

<!-- Content -->
<div class="flex flex-col items-center my-8">
  {% block content %}{% endblock %}
</div>

{% endblock %}
