# Overrides the stock nginx image's /etc/nginx/conf.d/default.conf (the
# "Welcome to nginx!" page), which would otherwise win for requests that
# don't match our app.conf's server_name (e.g. hitting the server by raw IP).
# Left empty on purpose — app.conf (generated from templates/app.conf.template)
# becomes the only, and therefore default, server for ports 80/443.
